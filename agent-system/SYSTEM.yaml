# -----------------------------------------------------------------------------
# 9. 约束 / 红线
# -----------------------------------------------------------------------------
constraints:
  - id: C1
    rule: "只用本地/免费工具；不装收费软件、不把项目文件传第三方、关闭工具遥测。"
    evidence: "AGENTS.md #6；docs/01 §16.9；Freerouting allow_telemetry=false"
  - id: C2
    rule: "原始资料（ref/、mechanical/original_cad/）只读，不覆盖。"
    evidence: "AGENTS.md #2"
  - id: C3
    rule: "机械版本各自独立 agentcad 项目，不跨项目改几何。"
    evidence: "AGENTS.md #3"
  - id: C4
    rule: "未确认参数标 PROVISIONAL 并写进 config；不得把推测写成实测。"
    evidence: "AGENTS.md #4；config/mechanical_params.yaml status"
  - id: C5
    rule: "每个域只有一个唯一来源；其它产物都是生成物（改源后重跑全部生成链）。"
    evidence: "docs/01 §16.1-2"
  - id: C6
    rule: "仿真通过 ≠ 实物通过；灵敏度/温漂/回差必须实物标定。"
    evidence: "AGENTS.md #7；docs/01 §13.8"
  - id: C7
    rule: "不做 GUI 自动化；用 CLI/API/工程文件。"
    evidence: "docs/01 §14.4；appearance/README §1.5"
  - id: C8
    rule: "任何『通过』必须有阈值来源（PRD/标准/供应商/实测）与证据文件。"
    evidence: "docs/01 §16.1-6；docs/16.9"
  - id: C9
    rule: "用户侧边界：采购/装配/实物标定/打样由用户执行，AI 只准备清单与记录表。"
    evidence: "docs/01 §16.1-9；tests/handboard/BRINGUP_RECORD.md"
  - id: C10
    rule: "未经确认不得进入高成本打样；git remote 推送需负责人授权。"
    evidence: "AGENTS.md #6；docs/REPORT_技术报告.md §2.5"
  - id: C11
    rule: "新工具装到 /data/Documents/tools/<tool> 并立即登记 requirements.yaml（含 Freerouting/Java/Xvfb 教训）。"
    evidence: "AGENTS.md #6；docs/01 §16.2"
  - id: C12
    rule: "不做『全部通过』表述；必须列出未测项与不能证明的边界。"
    evidence: "docs/01 §16.8；本文件 maturity.not_verified"

# -----------------------------------------------------------------------------
# 10. 决策规则
# -----------------------------------------------------------------------------
decision_rules:
  - id: D1
    rule: "PROVISIONAL 纪律：未确认尺寸/电气参数在代码与文档双标记，并登记 config；只有实测才能改 verified。"
  - id: D2
    rule: "单一来源：每个域只改源文件（square_model.py / design.py / 固件代码 / make_art.py），生成物一律重跑。"
  - id: D3
    rule: "证据优先：报告引用文件路径 + 时间戳；不接受『我跑过了』。"
  - id: D4
    rule: "阈值来源：每条验收写来源；无来源只能『记录』不能『判定通过』。"
  - id: D5
    rule: "冻结/变更隔离：先冻结功能基线，外观变体只改外皮；跨包络（如方形板塞圆形壳）按功能变更另立项。"
  - id: D6
    rule: "仿真边界：行为级 ≠ 芯片级；先写『能证明/不能证明』再写结论。"
  - id: D7
    rule: "机器可读优先：指标落 JSON/CSV；图只做辅助。"
  - id: D8
    rule: "独立复核：交付前由不参与实现的 verifier 只读复跑；作者自述不作为通过依据。"
  - id: D9
    rule: "失败不隐藏：真实发现登记为 finding/risk，写明影响与整改建议。"
  - id: D10
    rule: "写作用域：多 Agent 并行时每个任务只写自己的 scope，Lead 负责集成与最终 diff/测试。"

# -----------------------------------------------------------------------------
# 11. 多 Agent 写作用域（本项目实际使用）
# -----------------------------------------------------------------------------
write_scopes:
  - {id: WS-PRODUCT, prefixes: [docs/, config/], owner: product}
  - {id: WS-MECH, prefixes: [mechanical/, config/mechanical_params.yaml], owner: mechanical}
  - {id: WS-ELEC, prefixes: [electronics/, config/electronics.yaml], owner: electronics}
  - {id: WS-FW, prefixes: [firmware/, tests/firmware/], owner: firmware}
  - {id: WS-SIM, prefixes: [simulation/, config/validation_*.yaml], owner: simulation}
  - {id: WS-APPEAR, prefixes: [appearance/, render/, packaging/], owner: appearance}
  - {id: WS-VALID, prefixes: [docs/VERIFY_REPORT.md, docs/AUDIT_*.md, tests/], owner: validation}
  - {id: WS-LEAD, prefixes: [AGENTS.md, README.md, docs/HANDOFF.md, TASK_BOARD.md], owner: integration}
  - id: WS-RULE
    prefixes: []
    owner: integration
    rule: "写作用域是 advisory，不是锁；重叠时 Lead 显式排序，禁止两个 Agent 同时写同一文件。"

