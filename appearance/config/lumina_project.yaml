schema: smartcoaster.appearance.lumina_project/v1
project:
  name: SmartCoaster
  appearance_line: Lumina-Layers (Lumina Studio 2.0)
  replaces: Kromacut Flat Paint (appearance/kromacut/, now OBSOLETE)
  generator_line: A0-A2 / P3.5 (docs/01 section 17)
engine:
  name: Lumina-Layers
  root: /data/Documents/tools/Lumina-Layers
  venv: /data/Documents/tools/Lumina-Layers/.venv/bin/python
  entry: core.converter.build_image_model_context
  license: AGPL-3.0-only
  layer_height_mm: 0.08
  pixel_size_mm: 0.1
  offline:
    LUMINA_MATERIAL_REGISTRY_URL: ''
    LUMINA_LUT_REGISTRY_URL: ''
    LUMINA_FEEDBACK_SERVER_URL: 'off'
print:
  lut: lut-preset/Custom/lumina_lut.json
  lut_sha256_expected: ''
  color_mode: 4-Color (RYBW)
  slots:
  - White
  - Red
  - Yellow
  - Blue
  slot_hex:
  - '#FFFFFF'
  - '#DC143C'
  - '#FFE600'
  - '#0064F0'
  color_layers: 5
  spacer_thick_mm: 0.8
  total_layers: 15
  print_thickness_mm: 1.2
  structure_mode: Single-sided
  modeling_mode: HIGH_FIDELITY
  quantize_colors: 48
  blur_kernel: 0
  smooth_sigma: 10
  backing_color_id: 0
  backing_infill_density_percent: 100
  printer_id: bambu-h2d
  device_profile_id: BambuStudio:bbl:bambu-lab-h2d:0.4
  nozzle_size_mm: 0.4
  ams_slots_needed: 5
  color_budget: 5
  spool_inventory:
    white:
      hex: '#FFFFFF'
      used_for: print
    red:
      hex: '#DC143C'
      used_for: print
    yellow:
      hex: '#FFE600'
      used_for: print
    blue:
      hex: '#0064F0'
      used_for: print
    black:
      hex: '#101010'
      used_for: shell + plate + button
    green:
      hex: '#00AE42'
      used_for: spare
  vector_import:
    supported: true
    source_3mf_default: appearance/src/art/tmprarihgxw_Lumina_Vector_4C_20261108_131917.3mf
    face_texture_svg: appearance/src/vectorized.svg
    target_diameter_mm: 86.2
    drop_coating: true
    note: 'vector export: 5 colour layers + 0.005 base gap + 1.2 backing = 1.605 mm; the 0.08 mm transparent Coating part
      is dropped (5th spool); XY is re-squared to the circular pocket diameter'
art:
  source: appearance/src/surface.png
  frame_mm: 86.4
  pixel_grid: 864
  disc_diameter_mm: 86.4
  background: transparent (binary alpha outside the inscribed circle)
versions:
  round:
    label: LUMEN round d104
    art:
      name: dog
      png: appearance/build/art/dog/art_rgba.png
    shell:
      label: LUMEN round d104 (legacy appearance donor)
      mech_label: lumen
      project: mechanical/lumen
      plate_step: mechanical/lumen/build/parts/plate_v01.step
      rim_z_mm: 17.0
      pocket_dia_mm: 86.0
      print_dia_mm: 86.2
      interference_mm: 0.1
      top_gap_mm: 0.0
      print_thickness_mm: 1.2
  square:
    label: square_v1 100 x 100
    art:
      name: elf
      png: appearance/build/art/elf/art_rgba.png
      source: vector_3mf
      source_3mf: appearance/src/art/tmprarihgxw_Lumina_Vector_4C_20261108_131917.3mf
      face_texture_svg: appearance/src/vectorized.svg
    shell:
      label: square_v1 100 x 100 (functional baseline)
      mech_label: square_v1
      project: mechanical/square_v1
      plate_step: mechanical/square_v1/build/parts/plate_v01.step
      rim_z_mm: 18.0
      pocket_dia_mm: 86.0
      print_dia_mm: 86.2
      interference_mm: 0.1
      top_gap_mm: 0.0
      print_thickness_mm: 1.605
bed:
  printer: Bambu Lab X1C / P1S (256 x 256)
  delivery_bed_mm:
  - 220.0
  - 220.0
  min_gap_mm: 5.0
  layer_height_mm: 0.08
  note: 'In-situ route A prints plate + print on one plate at 0.08 mm layer height (the first 1.20 mm are the colour+backing
    stack).  Route B prints the shell at 0.20 mm on a second plate and presses/glues the print in afterwards.

    '
button:
  part: mechanical/square_v1/build/parts/button_v01.stl
  rule: lying flat like a coin (9.0 mm dia x 5.2 mm), visible cap face DOWN on the bed
  transform: RX90
print_delivery:
  root: render/print/stl
  versions:
  - round
  - square
  print_pose: plate + print flipped top-face-down; art face = first layer at z=0
  supports: none
  shell_pose: bottom-down (unchanged)
